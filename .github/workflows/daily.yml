name: daily-desk

# Free on standard GitHub-hosted runners for public repositories.
# Add OPENCODE_AUTH_JSON (the output of `opencode auth export`) as an Actions
# secret, then set the repository variable DAILY_ENABLED=true. Until then
# scheduled runs are skipped; manual runs work once the secret is present.
on:
  workflow_dispatch:
    inputs:
      probe:
        description: "Test OpenCode credentials only; do not publish"
        required: false
        default: false
        type: boolean
  schedule:
    # 05:30 America/Chicago in daylight time and standard time.
    - cron: "30 10 * * *"
    - cron: "30 11 * * *"

concurrency:
  group: i80-daily-desk
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  desk:
    if: github.event_name == 'workflow_dispatch' || vars.DAILY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TZ: America/Chicago
      NEXT_PUBLIC_SITE_URL: https://i80things.vercel.app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure git
        run: |
          git config user.name "i80things-daily"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config core.hooksPath .githooks

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Decide whether this scheduled run should execute
        id: clock
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          hour="$(date +%H)"
          if [ "$hour" = "05" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Local hour is $hour; this is the duplicate daylight-saving run."
          fi

      - name: Install OpenCode CLI
        if: steps.clock.outputs.run == 'true'
        shell: bash
        run: npm install -g @opencode/cli

      - name: Import OpenCode credentials
        if: steps.clock.outputs.run == 'true'
        shell: bash
        env:
          OPENCODE_AUTH_JSON: ${{ secrets.OPENCODE_AUTH_JSON }}
        run: |
          if [ -z "${OPENCODE_AUTH_JSON:-}" ]; then
            echo "::error::OPENCODE_AUTH_JSON is not set. Add the output of 'opencode auth export' in Settings → Secrets and variables → Actions."
            exit 1
          fi
          printf '%s' "$OPENCODE_AUTH_JSON" | opencode auth import
          opencode auth list

      - name: Preflight sources and 511
        if: steps.clock.outputs.run == 'true' && inputs.probe != true
        shell: bash
        run: bash scripts/preflight.sh

      - name: Probe OpenCode setup
        if: steps.clock.outputs.run == 'true' && inputs.probe == true
        shell: bash
        run: |
          opencode run \
            --model "opencode-go/muse-spark-1.3-contributor#high" \
            --auto \
            "Reply with exactly: OK. Do not read, edit, create or commit any file. Do not publish anything."

      - name: Run the daily desk
        if: steps.clock.outputs.run == 'true' && inputs.probe != true
        shell: bash
        run: bash scripts/daily-run.sh

      - name: Upload daily logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-desk-logs
          path: .cache/daily-desk/
          retention-days: 14
          if-no-files-found: ignore

      - name: Open a failure alert
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const date = new Date().toISOString().slice(0, 10);
            const title = `Daily desk failed — ${date}`;
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
            });
            if (existing.data.some((issue) => issue.title === title)) return;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body: [
                "The scheduled I-80 Things daily desk failed.",
                "",
                `Run: https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                `Commit: ${context.sha}`,
                "",
                "Check the workflow log before rerunning. Do not rerun until the cause is understood.",
              ].join("\n"),
            });
