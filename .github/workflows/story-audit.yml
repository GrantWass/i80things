name: story-audit

on:
  workflow_dispatch:
  schedule:
    # Monday morning; avoid GitHub's highest-load :00 scheduler slot.
    - cron: "17 14 * * 1"

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit story freshness
        id: audit
        shell: bash
        run: |
          node scripts/story-audit.mjs --json > /tmp/story-audit.json
          due="$(node -e 'const d=require("/tmp/story-audit.json"); process.stdout.write(String(d.counts.due))')"
          stale="$(node -e 'const d=require("/tmp/story-audit.json"); process.stdout.write(String(d.stories.filter((s) => s.stale.length > 0).length))')"
          echo "due=$due" >> "$GITHUB_OUTPUT"
          echo "stale=$stale" >> "$GITHUB_OUTPUT"

      - name: Build the review issue body
        if: steps.audit.outputs.due != '0' || steps.audit.outputs.stale != '0'
        shell: bash
        run: node scripts/story-audit.mjs --markdown > /tmp/story-audit.md

      - name: Open or update the weekly review issue
        if: steps.audit.outputs.due != '0' || steps.audit.outputs.stale != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const body = fs.readFileSync("/tmp/story-audit.md", "utf8");
            const title = "Story review — weekly";
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });
            const existing = open.data.find((issue) => issue.title === title);
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            }

      - name: No stories due
        if: steps.audit.outputs.due == '0' && steps.audit.outputs.stale == '0'
        run: echo "No stories are past their review cadence this week."
